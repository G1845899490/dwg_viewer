[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dwg-viewer"
version = "0.1.0"
description = "A DWG viewer for Windows built on PySide6 and ezdxf"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "ezdxf>=1.3",
    "numpy>=1.24",
    "Pillow>=10.0",
]

[project.scripts]
dwg-viewer = "dwg_viewer.main:main"

[tool.setuptools.packages.find]
where = ["src"]
